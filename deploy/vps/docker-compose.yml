name: baby-album-vps

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-baby_album}
      POSTGRES_USER: ${POSTGRES_USER:-baby_album}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-baby_album}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-15432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  api:
    build:
      context: ../../services/api
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      API_ADDR: ${API_ADDR:-:8080}
      DATABASE_URL: ${DATABASE_URL:-postgres://baby_album:baby_album@postgres:5432/baby_album?sslmode=disable}
      CACHE_ROOT: /var/lib/baby-album/cache
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-512}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://album.example.com}
    volumes:
      - media-cache:/var/lib/baby-album/cache
    ports:
      - "127.0.0.1:${API_PORT:-18080}:8080"

  web:
    build:
      context: ../../apps/web
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-https://album-api.example.com}
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-https://album-api.example.com}
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"

volumes:
  postgres-data:
  media-cache:

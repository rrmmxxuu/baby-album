name: ARM Runner Smoke

on:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: [self-hosted, Linux, ARM64]
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Show system info
        run: uname -a

      - name: Show docker version
        run: docker version

      - name: Show buildx version
        run: docker buildx version

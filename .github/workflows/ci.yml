name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  web:
    name: Web Checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install web dependencies
        run: npm ci
        working-directory: apps/web

      - name: Build web app
        run: npm run build
        working-directory: apps/web
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8080

      - name: Run web typecheck
        run: npm run typecheck
        working-directory: apps/web

      - name: Run web unit tests
        run: npm test
        working-directory: apps/web

  api:
    name: API Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum

      - name: Run API tests
        run: go test ./...
        working-directory: services/api
        env:
          GOCACHE: ${{ runner.temp }}/go-build-api

  agent:
    name: Agent Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: services/agent/go.mod
          cache-dependency-path: services/agent/go.sum

      - name: Run agent tests
        run: go test ./...
        working-directory: services/agent
        env:
          GOCACHE: ${{ runner.temp }}/go-build-agent

  docker-validate:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    needs:
      - web
      - api
      - agent
    env:
      NEXT_PUBLIC_API_BASE_URL: ${{ vars.PROD_NEXT_PUBLIC_API_BASE_URL || 'https://album-api.example.com' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate web image build
        uses: docker/build-push-action@v6
        with:
          context: ./apps/web
          file: ./apps/web/Dockerfile
          push: false
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ env.NEXT_PUBLIC_API_BASE_URL }}
          cache-from: type=gha,scope=web-image-amd64
          cache-to: type=gha,mode=max,scope=web-image-amd64

      - name: Validate API image build
        uses: docker/build-push-action@v6
        with:
          context: ./services/api
          file: ./services/api/Dockerfile
          push: false

      - name: Validate agent image build
        uses: docker/build-push-action@v6
        with:
          context: ./services/agent
          file: ./services/agent/Dockerfile
          push: false

  publish-images:
    name: Publish API and Agent Images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs:
      - web
      - api
      - agent
      - docker-validate
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_PLATFORMS: linux/amd64,linux/arm64
      NEXT_PUBLIC_API_BASE_URL: ${{ vars.PROD_NEXT_PUBLIC_API_BASE_URL || 'https://album-api.example.com' }}
      REGISTRY: ghcr.io
      IMAGE_NAMESPACE: ${{ github.repository_owner }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tag
        id: vars
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: ./services/api
          file: ./services/api/Dockerfile
          platforms: ${{ env.IMAGE_PLATFORMS }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/baby-album-api:main
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/baby-album-api:sha-${{ steps.vars.outputs.short_sha }}

      - name: Build and push agent image
        uses: docker/build-push-action@v6
        with:
          context: ./services/agent
          file: ./services/agent/Dockerfile
          platforms: ${{ env.IMAGE_PLATFORMS }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/baby-album-agent:main
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/baby-album-agent:sha-${{ steps.vars.outputs.short_sha }}

  publish-web-amd64:
    name: Publish Web Image (amd64)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs:
      - web
      - api
      - agent
      - docker-validate
    permissions:
      contents: read
      packages: write
    env:
      NEXT_PUBLIC_API_BASE_URL: ${{ vars.PROD_NEXT_PUBLIC_API_BASE_URL || 'https://album-api.example.com' }}
      REGISTRY: ghcr.io
      IMAGE_NAMESPACE: ${{ github.repository_owner }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tag
        id: vars
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and push web image for amd64
        uses: docker/build-push-action@v6
        with:
          context: ./apps/web
          file: ./apps/web/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ env.NEXT_PUBLIC_API_BASE_URL }}
          cache-from: type=gha,scope=web-image-amd64
          cache-to: type=gha,mode=max,scope=web-image-amd64
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/baby-album-web:sha-${{ steps.vars.outputs.short_sha }}-amd64

  publish-web-arm64:
    name: Publish Web Image (arm64)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, ARM64]
    needs:
      - web
      - api
      - agent
      - docker-validate
    permissions:
      contents: read
      packages: write
    env:
      NEXT_PUBLIC_API_BASE_URL: ${{ vars.PROD_NEXT_PUBLIC_API_BASE_URL || 'https://album-api.example.com' }}
      REGISTRY: ghcr.io
      IMAGE_NAMESPACE: ${{ github.repository_owner }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tag
        id: vars
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and push web image for arm64
        uses: docker/build-push-action@v6
        with:
          context: ./apps/web
          file: ./apps/web/Dockerfile
          platforms: linux/arm64
          push: true
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ env.NEXT_PUBLIC_API_BASE_URL }}
          cache-from: type=gha,scope=web-image-arm64
          cache-to: type=gha,mode=max,scope=web-image-arm64
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/baby-album-web:sha-${{ steps.vars.outputs.short_sha }}-arm64

  publish-web-manifest:
    name: Publish Web Image Manifest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs:
      - publish-web-amd64
      - publish-web-arm64
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
      IMAGE_NAMESPACE: ${{ github.repository_owner }}
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tag
        id: vars
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Create multi-arch web manifest
        run: |
          docker buildx imagetools create \
            --tag "${REGISTRY}/${IMAGE_NAMESPACE}/baby-album-web:main" \
            --tag "${REGISTRY}/${IMAGE_NAMESPACE}/baby-album-web:sha-${{ steps.vars.outputs.short_sha }}" \
            "${REGISTRY}/${IMAGE_NAMESPACE}/baby-album-web:sha-${{ steps.vars.outputs.short_sha }}-amd64" \
            "${REGISTRY}/${IMAGE_NAMESPACE}/baby-album-web:sha-${{ steps.vars.outputs.short_sha }}-arm64"

  e2e:
    name: Browser Smoke Tests
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    needs:
      - web
      - api
      - agent
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum

      - name: Install web dependencies
        run: npm ci
        working-directory: apps/web

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: apps/web

      - name: Run E2E smoke suite
        run: ./scripts/test-e2e.sh

name: baby-album

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: baby_album
      POSTGRES_USER: baby_album
      POSTGRES_PASSWORD: baby_album
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  api:
    build:
      context: ./services/api
    depends_on:
      - postgres
    environment:
      API_ADDR: :8080
      DATABASE_URL: postgres://baby_album:baby_album@postgres:5432/baby_album?sslmode=disable
      CACHE_ROOT: /var/lib/baby-album/cache
      MAX_UPLOAD_MB: 512
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
    volumes:
      - media-cache:/var/lib/baby-album/cache
    ports:
      - "${API_PORT:-8080}:8080"

  agent:
    build:
      context: ./services/agent
    depends_on:
      - api
    environment:
      AGENT_API_BASE_URL: ${AGENT_API_BASE_URL:-http://api:8080}
      AGENT_NODE_ID: ${AGENT_NODE_ID:-node-demo}
      AGENT_NODE_NAME: ${AGENT_NODE_NAME:-Living Room NAS}
      AGENT_REGISTRATION_TOKEN: ${AGENT_REGISTRATION_TOKEN:-demo-registration-token}
      AGENT_HEARTBEAT_INTERVAL: ${AGENT_HEARTBEAT_INTERVAL:-15s}
      AGENT_LIBRARY_ROOT: /var/lib/baby-album/library
    volumes:
      - media-library:/var/lib/baby-album/library

  web:
    build:
      context: ./apps/web
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080}
    ports:
      - "${WEB_PORT:-3000}:3000"

volumes:
  postgres-data:
  media-cache:
  media-library:
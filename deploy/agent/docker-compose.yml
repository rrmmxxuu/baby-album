services:
  agent:
    image: ${AGENT_IMAGE:-ghcr.io/rrmmxxuu/baby-album-agent}:${AGENT_IMAGE_TAG:-main}
    container_name: baby-album-agent
    restart: unless-stopped
    environment:
      AGENT_PANEL_ADDR: :8091
      AGENT_CONFIG_FILE: /config/agent.json
      AGENT_LIBRARY_ROOT: /data/library
      AGENT_MIGRATION_TARGET_ROOT: /data/migration-target
    ports:
      - ${AGENT_PANEL_PORT:-8091}:8091
    volumes:
      - ${AGENT_LIBRARY_HOST_PATH}:/data/library
      - ${AGENT_CONFIG_HOST_PATH}:/config
